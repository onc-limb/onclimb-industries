# 脱専門用語の言い換え辞書 (report-deck)
# 依頼者(非エンジニア)向けに、専門用語・固有技術名・略語を一般語へ言い換えるための対訳。
# エージェントが報告スライド生成時に参照し、辞書に無い語は言い換えを決めてここに追記して育てる。
#
# 形式:
#   - term:    元の語(表記ゆれは aliases に)
#     say:     言い換え(依頼者に伝わる一般語)
#     aliases: [別表記, ...]   # 任意
#
# 注意: 直訳で意味が壊れる語は、文脈ごとに say を調整するか、ユーザーに確認する。

terms:
  - term: ログイン認証
    say: ログインの仕組み
    aliases: [認証, 認証基盤, ログイン機能]
  - term: デプロイ
    say: 公開・利用できる状態にすること
    aliases: [リリース, 本番反映]
  - term: ビルド
    say: 動かせる形に組み上げること
  - term: API
    say: 外部サービスと情報をやり取りする仕組み
    aliases: [エンドポイント]
  - term: データベース
    say: 情報を保存しておく場所
    aliases: [DB, スキーマ, テーブル]
  - term: バグ
    say: 不具合
    aliases: [障害, エラー, クラッシュ, 異常終了]
  - term: リファクタリング
    say: 動きを変えずに内部を整理する作業
    aliases: [リファクタ]
  - term: マイグレーション
    say: 保存先の構成を作り直す作業
  - term: フロントエンド
    say: 利用者が見る画面側
  - term: バックエンド
    say: 裏側で処理を行う仕組み
  - term: 3D表示
    say: 立体で見られる表示
    aliases: [3Dビューア, レンダリング]
  - term: スキル
    say: AIアシスタントの機能
    aliases: [AIスキル]
  - term: 動作ルール
    say: AIアシスタントの動きを決める設定
    aliases: [SKILL.md, プロンプト, 指示書, persona, ペルソナ]

  # ------------------------------------------------------------
  # 2026-07-23 追加分（Wave B glossary マージ, report-record/*/*.DRAFT.md 由来）
  # 英字・略語はアルファベット順、日本語は五十音順の目安で追記。
  # ------------------------------------------------------------
  - term: AI
    say: AI
    aliases: [LLM, 大規模言語モデル]
  - term: CI
    say: コードを変更するたびに自動でチェック・検証が走る仕組み
    aliases: [継続的インテグレーション]
  - term: Cloud Run
    say: Googleのサーバー上でプログラムを動かす仕組み
  - term: Cloudflare Workers
    say: Cloudflareのサーバー上でプログラムを動かす仕組み
  - term: Dependabot
    say: 使っている部品(ライブラリ)の脆弱性を自動で知らせてくれる仕組み
    aliases: [脆弱性アラート]
  - term: Docker
    say: プログラムの実行環境を箱にまとめて持ち運べるようにする仕組み
    aliases: [Dockerfile, コンテナ]
  - term: green
    say: テストがすべて成功した状態
    aliases: [テストgreen, 全テストpass]
  - term: IAM
    say: 誰が何にアクセスできるかを管理する仕組み
  - term: JSONL
    say: 1行に1件のデータを記録するファイル形式
    aliases: [ログファイル形式]
  - term: lint
    say: コードの書き方チェック(自動)
    aliases: [ruff, lintクリーン]
  - term: MCP
    say: AIと外部サービスをつなぐ共通の接続規格
    aliases: [Model Context Protocol]
  - term: Modal
    say: 画像解析AIなどを動かす外部のサーバー基盤(サービス名)
  - term: OAuth
    say: 本人確認をした上で外部サービスへのアクセスを許可する仕組み
  - term: Terraform
    say: サーバーやクラウドの設定をコードで管理する仕組み
    aliases: [terraform import, tfvars]
  - term: venv
    say: Pythonの実行環境を他のプロジェクトと混ざらないよう独立させる仕組み
    aliases: [仮想環境, virtualenv]
  - term: worktree
    say: 元のコードに影響を与えずに別の場所で試せる作業用のコピー
    aliases: [git worktree]
  - term: エージェント
    say: AIが複数の作業を分担・並行してこなす仕組み
    aliases: [サブエージェント, 並列エージェント]
  - term: 型エラー
    say: データの種類が合っていないという間違い(プログラムのチェックで見つかる)
    aliases: [type error]
  - term: クォータ
    say: 短時間に使いすぎるとアクセスを一時的に制限される上限
    aliases: [レート制限, スロットリング]
  - term: コミット
    say: 変更内容を記録として保存すること
  - term: コンフリクト
    say: 複数の変更がぶつかって自動でまとめられない状態
    aliases: [マージコンフリクト]
  - term: 自己改善開発ループ
    say: AIが自分で開発・改善まで進める仕組み
    aliases: [kaizen, extremis, self-hosting]
  - term: チェリーピック
    say: 別の変更から必要な部分だけを選んで取り込むこと
    aliases: [cherry-pick]
  - term: 定期実行
    say: 決まった時間に自動で処理を走らせる仕組み
    aliases: [cron, launchd]
  - term: フック
    say: 特定の操作の前後に自動で実行される処理
    aliases: [Hook, PreToolUseフック]
  - term: ブランチ
    say: 元のコードから分かれて作業するための複製
  - term: パッケージマネージャー
    say: 必要な部品(ライブラリ)を自動で集めてくるツール
    aliases: [pnpm, npm]
  - term: プッシュ
    say: 手元の変更をオンラインの共有場所へ反映すること
    aliases: [git push]
  - term: プルリクエスト
    say: 変更内容をレビューしてから取り込んでもらうための提案
    aliases: [PR]
  - term: マージ
    say: 変更を本流に取り込むこと
    aliases: [スカッシュマージ, squashマージ]
  - term: リトライ
    say: 失敗した処理を自動でやり直すこと
    aliases: [バックオフ, 指数バックオフ]
  - term: リポジトリ
    say: プロジェクトのファイル一式を保存・管理する場所
  - term: ロールバック
    say: 問題が起きたときに前の状態に戻すこと
