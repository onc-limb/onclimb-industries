[package]
name = "sanctum"
version = "0.1.0"
edition = "2021"
description = "Obsidian-like local markdown notes web app for onclimb-industries"
publish = false

[dependencies]
topcoat = { version = "0.4", default-features = false, features = ["router", "view", "discover"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
